<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Multilingual multi-turn constraint benchmark">
  <defs>
    <linearGradient id="mmBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef0ff"/>
      <stop offset="1" stop-color="#e3e7ff"/>
    </linearGradient>
    <linearGradient id="mmFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3948d2"/>
      <stop offset="1" stop-color="#6a5bff"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#mmBg)"/>

  <!-- round 1: user turn -->
  <rect x="26" y="30" width="120" height="30" rx="12" fill="#ffffff" opacity=".9"/>
  <g fill="#3948d2" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial" font-size="14" font-weight="600">
    <text x="40" y="50">EN</text>
    <text x="74" y="50">ZH</text>
    <text x="108" y="50">JA</text>
  </g>

  <!-- model reply with unmet constraint -->
  <rect x="88" y="72" width="120" height="26" rx="12" fill="url(#mmFill)"/>
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".85">
    <path d="M104 85 H150"/>
    <path d="M160 85 H182"/>
  </g>
  <g stroke="#e14b5a" stroke-width="3" stroke-linecap="round">
    <path d="M220 79 L232 91"/>
    <path d="M232 79 L220 91"/>
  </g>

  <!-- feedback loop arrow -->
  <path d="M252 85 a30 30 0 0 1 0 42 H132" fill="none" stroke="#9aa3c7" stroke-width="3" stroke-linecap="round"/>
  <path d="M140 119 L128 127 L140 135 Z" fill="#9aa3c7"/>

  <!-- corrected reply -->
  <rect x="60" y="142" width="150" height="26" rx="12" fill="url(#mmFill)"/>
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".85">
    <path d="M76 155 H130"/>
    <path d="M140 155 H190"/>
  </g>
  <path d="M224 156 l8 8 l14 -18" fill="none" stroke="#1f9d63" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="272" y="46" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#3948d2" letter-spacing="1">round k</text>
</svg>
